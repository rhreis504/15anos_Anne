<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#22162b"><title>15 anos da Anne | Nossos momentos</title><style>*{box-sizing:border-box}body{margin:0;background:#160f1c;color:#fff7ef;font-family:system-ui,-apple-system,sans-serif}header{text-align:center;padding:72px 20px 48px;background:radial-gradient(circle at top,#624264,#22162b 65%)}.eyebrow{letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:#dfb9cb}h1{font-family:Georgia,serif;font-size:clamp(48px,11vw,92px);font-weight:400;margin:14px 0}p{line-height:1.6;color:#e9dce5}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}button,.btn{background:#f6d6e5;color:#261526;border:0;border-radius:40px;padding:15px 23px;font-weight:700;cursor:pointer;font-size:15px}button.secondary{background:transparent;color:white;border:1px solid #cdaebf}main{max-width:1050px;margin:auto;padding:38px 20px}h2{font-family:Georgia,serif;font-size:32px;font-weight:400}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.tile{background:#302239;border-radius:14px;overflow:hidden}.tile img{width:100%;aspect-ratio:1;object-fit:cover}.tile a{display:block;padding:12px;color:#f6d6e5}.empty{padding:48px 20px;text-align:center;border:1px dashed #8c718e;border-radius:16px}footer{text-align:center;padding:35px;color:#bca7bb;font-size:13px}input{display:none}</style></head><body><header><div class="eyebrow">Uma noite para sempre</div><h1>15 anos da Anne</h1><p>Cada olhar, cada sorriso, cada momento.<br>Compartilhe suas lembranças e reviva essa noite especial.</p><div class="actions"><button id="camera">📷 Tirar foto</button><button id="upload" class="secondary">Enviar fotos ou vídeos</button></div><input type="file" id="cameraInput" accept="image/*" capture="environment"><input type="file" id="fileInput" accept="image/*,video/*" multiple></header><main><h2>Nossos momentos</h2><div id="gallery" class="gallery"><div class="empty">As fotos da festa aparecerão aqui em breve. ✨</div></div></main><footer>Feito com carinho para os 15 anos da Anne</footer><script>const $=id=>document.getElementById(id);$('camera').onclick=()=>$('cameraInput').click();$('upload').onclick=()=>$('fileInput').click();for(const id of ['cameraInput','fileInput'])$(id).onchange=()=>alert('A página está em versão de demonstração. O envio será ativado após a configuração segura do Google Drive.');</script></body></html>
