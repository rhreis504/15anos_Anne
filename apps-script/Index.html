<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>15 anos da Anne</title>
<style>
:root{color-scheme:dark;font-synthesis:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;min-width:280px;background:#090909;color:#f7f3ed;font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-wrap:anywhere}
header{text-align:center;padding:clamp(42px,9vw,100px) max(18px,env(safe-area-inset-right)) 46px max(18px,env(safe-area-inset-left));padding-bottom:clamp(32px,6vw,64px)}
header>div:first-child{font-size:clamp(10px,2.5vw,13px);line-height:1.8}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.1}
h1{font-size:clamp(42px,10vw,92px);letter-spacing:-.045em;margin:18px auto;max-width:100%}
h2{font-size:clamp(28px,6vw,42px);margin:0 0 14px}
p{color:#c7c0ba;max-width:620px;margin:14px auto;line-height:1.65}
button,.download{border:1px solid #aaa;border-radius:30px;padding:14px 20px;min-height:48px;background:#fff;color:#111;font:600 15px/1.3 inherit;cursor:pointer;text-decoration:none;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid #d8c5a5;outline-offset:3px}
button.alt{background:transparent;color:#fff}
main{max-width:1100px;margin:auto;padding:clamp(22px,5vw,48px) max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left))}
main>p{margin:0 0 25px}
#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:clamp(8px,2vw,16px);align-items:start}
.card{min-width:0;background:#222;border-radius:12px;overflow:hidden}
.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.card .meta{padding:12px;overflow-wrap:anywhere}
.card a{color:white;font-size:14px;line-height:1.5}
#status{padding:14px 8px;text-align:center;max-width:640px;margin:12px auto 0;min-height:20px;overflow-wrap:anywhere}
input[type=file]{display:none}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;max-width:650px;margin:26px auto 0}
.actions button{flex:0 1 auto;white-space:normal}
.empty{text-align:center;padding:40px 18px;border:1px dashed #555;grid-column:1/-1;border-radius:12px}
@media(max-width:600px){
 header{padding-top:55px;padding-bottom:32px}
 h1{font-size:clamp(43px,12vw,68px)}
 .actions{flex-direction:column;align-items:stretch;max-width:420px;gap:10px}
 .actions button{width:100%;min-height:52px}
 main{padding-top:25px}
 #gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .card{border-radius:9px}
 .card .meta{padding:9px}
 .card a{font-size:12px}
}
@media(max-width:350px){#gallery{grid-template-columns:1fr}.card a{font-size:14px}}
@media(hover:hover){button:hover{opacity:.87}.card:hover{transform:translateY(-2px);transition:transform .2s}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<header>
<div style="letter-spacing:.3em">UMA NOITE PARA SEMPRE</div>
<h1>15 anos da Anne</h1>
<p>Momentos inesquecíveis, compartilhados por quem viveu cada instante.</p>
<div class="actions">
<button onclick="document.getElementById('camera').click()">Tirar foto</button>
<button class="alt" onclick="document.getElementById('files').click()">Enviar fotos e vídeos</button>
</div>
<input id="camera" type="file" accept="image/*" capture="environment">
<input id="files" type="file" accept="image/*,video/*" multiple>
<div id="status" role="status">
</div>
</header>
<main>
<h2>Nossos momentos</h2>
<p>Explore as lembranças da festa e baixe suas favoritas.</p>
<div id="gallery">
<div class="empty">Carregando momentos…</div>
</div>
</main>
<script>
const el=id=>document.getElementById(id);function status(s){el('status').textContent=s}
function refresh(){google.script.run.withSuccessHandler(items=>{const root=el('gallery');root.replaceChildren();if(!items.length){root.innerHTML='<div class="empty">Seja o primeiro a compartilhar um momento!</div>';return}
for(const item of items){const card=document.createElement('article');card.className='card';const link=document.createElement('a');link.href=item.view;link.target='_blank';link.rel='noopener';const pic=document.createElement('img');pic.loading='lazy';pic.alt='Momento da festa';pic.src=item.thumb;link.append(pic);const meta=document.createElement('div');meta.className='meta';const a=document.createElement('a');a.href=item.download;a.target='_blank';a.rel='noopener';a.textContent=item.type.startsWith('video/')?'Assistir / baixar vídeo':'Visualizar / baixar foto';meta.append(a);card.append(link,meta);root.append(card)}}).withFailureHandler(e=>status('Não foi possível carregar a galeria: '+e.message)).listMedia()}
async function send(files){const selected=[...files];if(!selected.length)return;for(let i=0;i<selected.length;i++){const f=selected[i];if(f.size>15*1024*1024){status('Arquivo '+f.name+' ultrapassa 15 MB. Envie um arquivo menor.');continue}
status('Enviando '+(i+1)+' de '+selected.length+': '+f.name);try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(f)});await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).uploadMedia({name:f.name,mime:f.type,base64:data}));status('Enviado '+(i+1)+' de '+selected.length);refresh()}
catch(e){status('Falha ao enviar '+f.name+': '+e.message);return}}status('Envio concluído!')}el('camera').onchange=e=>send(e.target.files);el('files').onchange=e=>send(e.target.files);refresh();setInterval(refresh,30000)
</script>
</body>
</html>
